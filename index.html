<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ecommerce Frontend</title>
    <!-- CDNs for React and Dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/react@17/umd/react.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@17/umd/react-dom.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jwt-decode@3/lib/jwt-decode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@material-ui/core@4/umd/material-ui.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-router-dom@5/dist/react-router-dom.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
    <!-- Basic Styling -->
    <style>
        body { margin: 0; font-family: Roboto, sans-serif; }
        #root { min-height: 100vh; display: flex; flex-direction: column; }
        main { flex: 1; padding: 20px; }
        footer { background: #556cd6; color: white; text-align: center; padding: 10px; }
        .MuiTextField-root { margin: 8px 0 !important; }
        .MuiButton-root { margin: 8px !important; }
    </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
    const { useState, useEffect, useContext, createContext } = React;
    const { BrowserRouter, Route, Switch, Link, useHistory, useParams, useLocation, Redirect } = ReactRouterDOM;
    const {
        AppBar, Toolbar, Typography, Button, TextField, Card, CardContent, Grid,
        CircularProgress, Snackbar, Dialog, DialogTitle, DialogContent,
        Table, TableBody, TableCell, TableHead, TableRow
    } = MaterialUI;

    // API Configuration
    const api = axios.create({ baseURL: 'http://localhost:8080' });

    // Auth Context for User Management
    const AuthContext = createContext();
    const AuthProvider = ({ children }) => {
        const [token, setToken] = useState(localStorage.getItem('token') || null);
        const [user, setUser] = useState(null);
        const [error, setError] = useState(null);

        useEffect(() => {
            if (token) {
                try {
                    const decoded = jwt_decode(token);
                    setUser({ username: decoded.sub, roles: decoded.authorities || [] });
                    api.defaults.headers.common['Authorization'] = `Bearer ${token}`;
                } catch (e) {
                    setError('Invalid token');
                    setToken(null);
                    localStorage.removeItem('token');
                }
            } else {
                setUser(null);
                delete api.defaults.headers.common['Authorization'];
            }
        }, [token]);

        const login = async (username, password) => {
            try {
                const response = await api.post('/api/users/login', { username, password });
                const newToken = response.data.token || response.data;
                setToken(newToken);
                localStorage.setItem('token', newToken);
                setError(null);
            } catch (err) {
                setError('Login failed');
                throw err;
            }
        };

        const logout = () => {
            setToken(null);
            localStorage.removeItem('token');
            setUser(null);
        };

        return (
            <AuthContext.Provider value={{ token, user, login, logout }}>
                {children}
                <Snackbar open={!!error} message={error} onClose={() => setError(null)} />
            </AuthContext.Provider>
        );
    };

    // Cart Context for Shopping Cart
    const CartContext = createContext();
    const CartProvider = ({ children }) => {
        const [cartItems, setCartItems] = useState(JSON.parse(localStorage.getItem('cart')) || []);

        useEffect(() => {
            localStorage.setItem('cart', JSON.stringify(cartItems));
        }, [cartItems]);

        const addToCart = (product) => {
            setCartItems((prev) => {
                const existing = prev.find((item) => item.productId === product.productId);
                if (existing) {
                    return prev.map((item) =>
                        item.productId === product.productId ? { ...item, quantity: item.quantity + 1 } : item
                    );
                }
                return [...prev, { ...product, quantity: 1 }];
            });
        };

        const removeFromCart = (productId) => {
            setCartItems((prev) => prev.filter((item) => item.productId !== productId));
        };

        const clearCart = () => setCartItems([]);

        return (
            <CartContext.Provider value={{ cartItems, addToCart, removeFromCart, clearCart }}>
                {children}
            </CartContext.Provider>
        );
    };

    // Route Guards
    const PrivateRoute = ({ component: Component, ...rest }) => {
        const { token } = useContext(AuthContext);
        return (
            <Route {...rest} render={(props) => token ? <Component {...props} /> : <Redirect to="/login" />} />
        );
    };

    const AdminRoute = ({ component: Component, ...rest }) => {
        const { user } = useContext(AuthContext);
        return (
            <Route {...rest} render={(props) => user && user.roles.includes('ROLE_ADMIN') ? <Component {...props} /> : <Redirect to="/" />} />
        );
    };

    // Navbar Component
    const Navbar = () => {
        const { token, user, logout } = useContext(AuthContext);
        const { cartItems } = useContext(CartContext);
        return (
            <AppBar position="static">
                <Toolbar>
                    <Typography variant="h6" style={{ flexGrow: 1 }}>Ecommerce App</Typography>
                    <Button color="inherit" component={Link} to="/">Home</Button>
                    <Button color="inherit" component={Link} to="/products">Products</Button>
                    {token ? (
                        <>
                            <Button color="inherit" component={Link} to="/profile">Profile</Button>
                            <Button color="inherit" component={Link} to="/cart">Cart ({cartItems.length})</Button>
                            <Button color="inherit" onClick={logout}>Logout</Button>
                            {user?.roles.includes('ROLE_ADMIN') && (
                                <Button color="inherit" component={Link} to="/admin">Admin</Button>
                            )}
                        </>
                    ) : (
                        <>
                            <Button color="inherit" component={Link} to="/login">Login</Button>
                            <Button color="inherit" component={Link} to="/register">Register</Button>
                        </>
                    )}
                </Toolbar>
            </AppBar>
        );
    };

    // Footer Component
    const Footer = () => <footer><Typography>Ecommerce Project © 2023</Typography></footer>;

    // Home Page
    const Home = () => {
        const [featured, setFeatured] = useState([]);
        const [loading, setLoading] = useState(true);
        useEffect(() => {
            api.get('/api/products/featured')
                .then((res) => {
                    setFeatured(res.data);
                    setLoading(false);
                })
                .catch(() => setLoading(false));
        }, []);
        if (loading) return <CircularProgress />;
        return (
            <main>
                <Typography variant="h4">Featured Products</Typography>
                <Grid container spacing={2}>
                    {featured.map((product) => <ProductCard key={product.productId} product={product} />)}
                </Grid>
            </main>
        );
    };

    // ProductCard Component
    const ProductCard = ({ product }) => {
        const { addToCart } = useContext(CartContext);
        return (
            <Grid item xs={12} sm={6} md={4}>
                <Card>
                    <CardContent>
                        <Typography variant="h6">{product.name}</Typography>
                        <Typography>${product.price}</Typography>
                        <Button variant="outlined" component={Link} to={`/product/${product.productId}`}>Details</Button>
                        <Button variant="contained" color="primary" onClick={() => addToCart(product)}>Add to Cart</Button>
                    </CardContent>
                </Card>
            </Grid>
        );
    };

    // Products Page
    const Products = () => {
        const [products, setProducts] = useState([]);
        const [page, setPage] = useState(0);
        const [totalPages, setTotalPages] = useState(1);
        const [search, setSearch] = useState('');
        const [loading, setLoading] = useState(true);

        useEffect(() => {
            setLoading(true);
            api.get('/api/products/allProducts', { params: { page, size: 10, name: search } })
                .then((res) => {
                    setProducts(res.data.content || res.data.products);
                    setTotalPages(res.data.totalPages || 1);
                    setLoading(false);
                })
                .catch(() => setLoading(false));
        }, [page, search]);

        if (loading) return <CircularProgress />;
        return (
            <main>
                <Typography variant="h4">All Products</Typography>
                <TextField
                    label="Search Products"
                    value={search}
                    onChange={(e) => { setSearch(e.target.value); setPage(0); }}
                    fullWidth
                />
                <Grid container spacing={2}>
                    {products.map((product) => <ProductCard key={product.productId} product={product} />)}
                </Grid>
                <div>
                    <Button disabled={page === 0} onClick={() => setPage(page - 1)}>Previous</Button>
                    <Typography display="inline">Page {page + 1} of {totalPages}</Typography>
                    <Button disabled={page >= totalPages - 1} onClick={() => setPage(page + 1)}>Next</Button>
                </div>
            </main>
        );
    };

    // Product Details Page
    const ProductDetails = () => {
        const { id } = useParams();
        const [product, setProduct] = useState(null);
        const { addToCart } = useContext(CartContext);
        useEffect(() => {
            api.get(`/api/products/get/${id}`).then((res) => setProduct(res.data));
        }, [id]);
        if (!product) return <CircularProgress />;
        return (
            <main>
                <Card>
                    <CardContent>
                        <Typography variant="h4">{product.name}</Typography>
                        <Typography>{product.description}</Typography>
                        <Typography>${product.price}</Typography>
                        <Button variant="contained" color="primary" onClick={() => addToCart(product)}>Add to Cart</Button>
                    </CardContent>
                </Card>
            </main>
        );
    };

    // Login Page
    const Login = () => {
        const [username, setUsername] = useState('');
        const [password, setPassword] = useState('');
        const { login } = useContext(AuthContext);
        const history = useHistory();

        const handleLogin = () => {
            login(username, password)
                .then(() => history.push('/'))
                .catch(() => console.log('Login error handled by Snackbar'));
        };

        return (
            <main>
                <Typography variant="h4">Login</Typography>
                <TextField label="Username" value={username} onChange={(e) => setUsername(e.target.value)} fullWidth />
                <TextField label="Password" type="password" value={password} onChange={(e) => setPassword(e.target.value)} fullWidth />
                <Button variant="contained" color="primary" onClick={handleLogin}>Login</Button>
            </main>
        );
    };

    // Register Page
    const Register = () => {
        const [form, setForm] = useState({ username: '', email: '', password: '', phoneNumber: '' });
        const history = useHistory();

        const handleRegister = () => {
            api.post('/api/users/register', form)
                .then(() => history.push('/login'))
                .catch(() => alert('Registration failed'));
        };

        return (
            <main>
                <Typography variant="h4">Register</Typography>
                {Object.keys(form).map((key) => (
                    <TextField
                        key={key}
                        label={key.charAt(0).toUpperCase() + key.slice(1)}
                        value={form[key]}
                        onChange={(e) => setForm({ ...form, [key]: e.target.value })}
                        fullWidth
                        type={key === 'password' ? 'password' : 'text'}
                    />
                ))}
                <Button variant="contained" color="primary" onClick={handleRegister}>Register</Button>
            </main>
        );
    };

    // Profile Page
    const Profile = () => {
        const [user, setUser] = useState(null);
        const [loading, setLoading] = useState(true);
        useEffect(() => {
            api.get('/api/users/profile')
                .then((res) => {
                    setUser(res.data);
                    setLoading(false);
                })
                .catch(() => setLoading(false));
        }, []);

        const handleUpdate = () => {
            api.put('/api/users/update', user).catch(() => alert('Update failed'));
        };

        if (loading) return <CircularProgress />;
        if (!user) return <Typography>Error loading profile</Typography>;
        return (
            <main>
                <Typography variant="h4">Profile</Typography>
                <TextField label="Username" value={user.username} onChange={(e) => setUser({ ...user, username: e.target.value })} fullWidth />
                <TextField label="Email" value={user.email} onChange={(e) => setUser({ ...user, email: e.target.value })} fullWidth />
                <Button variant="contained" color="primary" onClick={handleUpdate}>Update</Button>
                <Button variant="outlined" component={Link} to="/addresses">Manage Addresses</Button>
                <Button variant="outlined" component={Link} to="/orders">View Orders</Button>
            </main>
        );
    };

    // Addresses Page
    const Addresses = () => {
        const [addresses, setAddresses] = useState([]);
        useEffect(() => {
            api.get('/api/users/addresses').then((res) => setAddresses(res.data));
        }, []);

        const addAddress = () => {
            const newAddress = { street: 'New Street', city: 'New City' }; // Simplified example
            api.post('/api/users/addresses/add', newAddress)
                .then((res) => setAddresses([...addresses, res.data]));
        };

        return (
            <main>
                <Typography variant="h4">Addresses</Typography>
                {addresses.map((addr) => (
                    <Typography key={addr.addressId}>{addr.street}, {addr.city}</Typography>
                ))}
                <Button variant="contained" color="primary" onClick={addAddress}>Add Address</Button>
            </main>
        );
    };

    // Orders Page
    const Orders = () => {
        const [orders, setOrders] = useState([]);
        useEffect(() => {
            api.get('/api/users/orders').then((res) => setOrders(res.data));
        }, []);
        return (
            <main>
                <Typography variant="h4">Orders</Typography>
                {orders.map((order) => (
                    <Typography key={order.orderId}>
                        Order #{order.orderId} - <Link to={`/order/${order.orderId}`}>Details</Link>
                    </Typography>
                ))}
            </main>
        );
    };

    // Order Details Page
    const OrderDetails = () => {
        const { id } = useParams();
        const [order, setOrder] = useState(null);
        useEffect(() => {
            api.get(`/api/users/orders/${id}`).then((res) => setOrder(res.data));
        }, [id]);
        if (!order) return <CircularProgress />;
        return (
            <main>
                <Typography variant="h4">Order #{order.orderId}</Typography>
                {order.orderItems.map((item) => (
                    <Typography key={item.orderItemId}>{item.productName} - Qty: {item.quantity}</Typography>
                ))}
            </main>
        );
    };

    // Cart Page
    const Cart = () => {
        const { cartItems, removeFromCart, clearCart } = useContext(CartContext);
        const history = useHistory();

        const total = cartItems.reduce((sum, item) => sum + item.price * item.quantity, 0);

        const handleCheckout = () => {
            api.post('/api/orders', { items: cartItems })
                .then(() => {
                    clearCart();
                    history.push('/orders');
                })
                .catch(() => alert('Checkout failed'));
        };

        return (
            <main>
                <Typography variant="h4">Cart</Typography>
                {cartItems.length === 0 ? (
                    <Typography>Your cart is empty</Typography>
                ) : (
                    <>
                        {cartItems.map((item) => (
                            <Card key={item.productId} style={{ marginBottom: '10px' }}>
                                <CardContent>
                                    <Typography>{item.name} - Qty: {item.quantity} - ${item.price * item.quantity}</Typography>
                                    <Button variant="outlined" color="secondary" onClick={() => removeFromCart(item.productId)}>Remove</Button>
                                </CardContent>
                            </Card>
                        ))}
                        <Typography variant="h6">Total: ${total.toFixed(2)}</Typography>
                        <Button variant="contained" color="primary" onClick={handleCheckout}>Checkout</Button>
                    </>
                )}
            </main>
        );
    };

    // Admin Dashboard
    const AdminDashboard = () => (
        <main>
            <Typography variant="h4">Admin Dashboard</Typography>
            <Button variant="outlined" component={Link} to="/admin/products">Manage Products</Button>
            <Button variant="outlined" component={Link} to="/admin/users">Manage Users</Button>
        </main>
    );

    // Manage Products Page
    const ManageProducts = () => {
        const [products, setProducts] = useState([]);
        const [open, setOpen] = useState(false);
        const [form, setForm] = useState({ name: '', price: '', description: '' });

        useEffect(() => {
            api.get('/api/products/allProducts').then((res) => setProducts(res.data.content || res.data.products));
        }, []);

        const handleAdd = () => {
            api.post('/api/products/add', { ...form, price: parseFloat(form.price) })
                .then((res) => {
                    setProducts([...products, res.data]);
                    setOpen(false);
                    setForm({ name: '', price: '', description: '' });
                });
        };

        const handleDelete = (id) => {
            api.delete(`/api/products/delete/${id}`)
                .then(() => setProducts(products.filter((p) => p.productId !== id)));
        };

        return (
            <main>
                <Typography variant="h4">Manage Products</Typography>
                <Button variant="contained" color="primary" onClick={() => setOpen(true)}>Add Product</Button>
                <Table>
                    <TableHead>
                        <TableRow>
                            <TableCell>Name</TableCell>
                            <TableCell>Price</TableCell>
                            <TableCell>Actions</TableCell>
                        </TableRow>
                    </TableHead>
                    <TableBody>
                        {products.map((product) => (
                            <TableRow key={product.productId}>
                                <TableCell>{product.name}</TableCell>
                                <TableCell>${product.price}</TableCell>
                                <TableCell>
                                    <Button variant="outlined" color="secondary" onClick={() => handleDelete(product.productId)}>Delete</Button>
                                </TableCell>
                            </TableRow>
                        ))}
                    </TableBody>
                </Table>
                <Dialog open={open} onClose={() => setOpen(false)}>
                    <DialogTitle>Add Product</DialogTitle>
                    <DialogContent>
                        <TextField label="Name" value={form.name} onChange={(e) => setForm({ ...form, name: e.target.value })} fullWidth />
                        <TextField label="Price" value={form.price} onChange={(e) => setForm({ ...form, price: e.target.value })} fullWidth type="number" />
                        <TextField label="Description" value={form.description} onChange={(e) => setForm({ ...form, description: e.target.value })} fullWidth />
                        <Button variant="contained" color="primary" onClick={handleAdd}>Save</Button>
                    </DialogContent>
                </Dialog>
            </main>
        );
    };

    // Manage Users Page
    const ManageUsers = () => {
        const [users, setUsers] = useState([]);
        useEffect(() => {
            api.get('/api/users/admin/users').then((res) => setUsers(res.data));
        }, []);

        const deactivateUser = (id) => {
            api.put(`/api/users/admin/users/${id}/deactivate`)
                .then(() => setUsers(users.map((u) => u.userId === id ? { ...u, enabled: false } : u)));
        };

        return (
            <main>
                <Typography variant="h4">Manage Users</Typography>
                <Table>
                    <TableHead>
                        <TableRow>
                            <TableCell>Username</TableCell>
                            <TableCell>Status</TableCell>
                            <TableCell>Actions</TableCell>
                        </TableRow>
                    </TableHead>
                    <TableBody>
                        {users.map((user) => (
                            <TableRow key={user.userId}>
                                <TableCell>{user.username}</TableCell>
                                <TableCell>{user.enabled ? 'Active' : 'Inactive'}</TableCell>
                                <TableCell>
                                    <Button variant="outlined" color="secondary" onClick={() => deactivateUser(user.userId)} disabled={!user.enabled}>
                                        Deactivate
                                    </Button>
                                </TableCell>
                            </TableRow>
                        ))}
                    </TableBody>
                </Table>
            </main>
        );
    };

    // App Component
    const App = () => (
        <AuthProvider>
            <CartProvider>
                <BrowserRouter>
                    <Navbar />
                    <Switch>
                        <Route exact path="/" component={Home} />
                        <Route path="/products" component={Products} />
                        <Route path="/product/:id" component={ProductDetails} />
                        <Route path="/login" component={Login} />
                        <Route path="/register" component={Register} />
                        <PrivateRoute path="/profile" component={Profile} />
                        <PrivateRoute path="/addresses" component={Addresses} />
                        <PrivateRoute path="/orders" component={Orders} />
                        <PrivateRoute path="/order/:id" component={OrderDetails} />
                        <PrivateRoute path="/cart" component={Cart} />
                        <AdminRoute path="/admin" exact component={AdminDashboard} />
                        <AdminRoute path="/admin/products" component={ManageProducts} />
                        <AdminRoute path="/admin/users" component={ManageUsers} />
                    </Switch>
                    <Footer />
                </BrowserRouter>
            </CartProvider>
        </AuthProvider>
    );

    ReactDOM.render(<App />, document.getElementById('root'));
</script>
</body>
</html>
